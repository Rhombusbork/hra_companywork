# 학교 게시판·학식을 모아 site/data 를 갱신하고 Pages 에 다시 올린다.
# 하루 4번 (한국 07:17 · 12:17 · 17:17 · 22:17). cron 은 UTC 라서 9시간을 뺐다 (07 4-2절).
# collector/ 를 고쳐 main 에 push 해도 한 번 돈다 (= Actions 러너에서 학교 사이트가 열리는지 시험).
# 한 곳이라도 실패하면 데이터는 그대로 올리고 마지막에 실패로 끝난다 → 저장소 주인에게 GitHub 가 메일을 보낸다.
name: collect
on:
  schedule:
    - cron: "17 22,3,8,13 * * *"
  push:
    branches: [main]
    paths: ["collector/**", "certs/**", ".github/workflows/collect.yml"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r collector/requirements.txt
      - name: collect
        id: run
        run: |
          set +e
          python collector/collect.py
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "data: 자동 수집 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
  deploy:
    needs: collect
    if: always()
    uses: ./.github/workflows/pages.yml
  report:
    needs: [collect, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "자동 수집 실패"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # 실패하면 이슈를 하나 열어 조원 모두가 보게 한다 (이미 열려 있으면 댓글만). 다시 성공하면 닫는다.
      - name: 이슈 열기·닫기
        run: |
          open=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number' || true)
          if [ "${{ needs.collect.outputs.status }}" != "0" ]; then
            errs=$(python3 -c "import json;d=json.load(open('site/data/items.json'));print('\n'.join(f'- {k}: {v.get(\"error\")}' for k,v in d['sources'].items() if not v.get('ok')) or '- (공지 말고 학식·학사일정 쪽일 수 있음, 로그 확인)')")
            body=$(printf '실패한 곳:\n%s\n\n실패한 곳은 이전 데이터를 그대로 보여 주고 있다. 로그: %s\n\n고치는 법은 README 의 "수집기 돌리기".' "$errs" "$RUN_URL")
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "다시 정상으로 수집됨: $RUN_URL"
          fi
      - name: 실패한 정보원이 있으면 실패로 끝냄
        run: |
          if [ "${{ needs.collect.outputs.status }}" != "0" ]; then
            echo "::error::수집 중 실패한 곳이 있음. collect 단계 로그와 items.json 의 sources[].error 를 볼 것"; exit 1
          fi
