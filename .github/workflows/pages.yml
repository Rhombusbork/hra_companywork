# site/ 를 gh-pages 브랜치에 올린다 (GitHub Pages). main 에 push 하면 자동.
# collect.yml 이 수집 뒤에 이 워크플로를 불러 쓴다 (봇 push 는 다른 워크플로를 깨우지 않아서).
# 옛 v2 시안 주소(/v2/)는 site/v2/index.html 이 v1 주소로 넘긴다 (11/26 합침).
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: push site/ to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
